<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LocalLens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..900,0..100,0..1&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDxIKVcdpUYKQywVrekgweDGCHqLTXx_m4" defer></script>
  <script>
    // Apply theme before first paint to avoid flash
    (function() {
      var mode = localStorage.getItem('locallens.theme') || 'system';
      if (mode === 'light' || mode === 'dark') {
        document.documentElement.setAttribute('data-theme', mode);
      }
    })();
  </script>
</head>
<body>
  <div id="app">
    <header id="app-header"></header>
    <main id="app-main"></main>
    <footer id="app-footer"></footer>
    <div id="ai-widget"></div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/location.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/components.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/login.js"></script>
  <script src="js/pages/register.js"></script>
  <script src="js/pages/search.js"></script>
  <script src="js/pages/business-detail.js"></script>
  <script src="js/pages/favorites.js"></script>
  <script src="js/pages/deals.js"></script>
  <script src="js/pages/profile.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/ai-chat.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
