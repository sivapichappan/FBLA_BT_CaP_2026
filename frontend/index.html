<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="LocalLens — discover and support independent local businesses near you."
    />
    <title>LocalLens — Discover local, independent businesses</title>

    <!-- Fonts: Playfair Display (headlines) + Lora (body). Preconnect first
         to cut render-blocking latency. Mono uses the system stack. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Lora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Set the theme BEFORE first paint so dark-mode users never see a light
         flash. Mirrors lib/theme.ts: a saved choice wins, else the OS pref. -->
    <script>
      try {
        var saved = localStorage.getItem("locallens_theme");
        document.documentElement.dataset.theme =
          saved === "dark" || saved === "light"
            ? saved
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <!-- React mounts here. The cream background + grain are set on <body> in
         tokens.css so there is no flash of unstyled white before React loads. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
